<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#087b61" />
    <meta name="description" content="HOME AI kết nối bạn với thợ sửa chữa uy tín gần nhà tại Việt Nam." />
    <title>HOME AI | Dịch vụ gia đình</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      globalThis.__HOME_AI_CLIENT_CACHE_READY__ = (async () => {
        if (!('serviceWorker' in navigator)) return;
        const buildId = '__HOME_AI_BUILD_ID__';
        const base = new URL('./', location.href);
        const registrations = await navigator.serviceWorker.getRegistrations();
        const legacy = registrations.filter(registration => {
          const worker = registration.active || registration.waiting || registration.installing;
          return registration.scope === base.href && worker && new URL(worker.scriptURL).pathname.endsWith('/provider-sw.js');
        });
        const controlled = Boolean(navigator.serviceWorker.controller
          && new URL(navigator.serviceWorker.controller.scriptURL).pathname.endsWith('/provider-sw.js'));
        await Promise.all(legacy.map(registration => registration.unregister()));
        if ('caches' in globalThis) {
          const keys = await caches.keys();
          await Promise.all(keys.filter(key => key.startsWith('home-ai-provider-')).map(key => caches.delete(key)));
        }
        const reloadKey = `home-ai-client-cache-reset-${buildId}`;
        if (controlled && sessionStorage.getItem(reloadKey) !== 'done') {
          sessionStorage.setItem(reloadKey, 'done');
          const cleanUrl = new URL('./', location.href);
          cleanUrl.searchParams.set('v', buildId);
          location.replace(cleanUrl.href);
          await new Promise(() => {});
        }
      })().catch(() => {});
    </script>
    <script src="./src/runtime-config.js"></script>
    <script type="importmap">
      {"imports":{"@supabase/supabase-js":"https://esm.sh/@supabase/supabase-js@2.112.4"}}
    </script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
