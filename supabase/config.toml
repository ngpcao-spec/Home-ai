[functions.diagnose-home-request]
verify_jwt = true

[functions.classify-provider-activity]
verify_jwt = true

[functions.analyze-provider-identity]
verify_jwt = true

[functions.issue-stringee-token]
verify_jwt = true

# Called by Stringee servers. Authentication is the mandatory signed request
# verified inside the function with STRINGEE_SIGNING_SECRET_KEY.
[functions.stringee-answer]
verify_jwt = false

# Called only by the authenticated Database Webhook; the function verifies
# x-home-ai-push-secret before reading the durable outbox.
[functions.send-provider-push]
verify_jwt = false

# Invoked by Supabase Auth; Standard Webhooks signature is mandatory in handler.
[functions.send-auth-sms]
verify_jwt = false
